Goal_ID: COMMUNITY.INCLUSION
Name: 包容
Name_EN: Inclusion
Description: |
  通过空间内容确保不同年龄、能力、性别、文化背景的人都能平等使用与享受。
Success_Indicators:
  - 不同群体使用比例
  - 无障碍设施使用率
  - 跨年龄互动发生率
Typical_Projects:
  - 公共广场
  - 社区公园
  - 文旅
  - 街区
Suitable_Objects:
  - Seating Area
  - Sensory Garden
  - Reading Corner
  - Amphitheater
  - Nature Element
Unsuitable_Objects:
  - Performance Stage
  - Sports Facility
Heuristics:
  - 任何设计决策都要问「这是否排除了某一类用户？」
  - 至少满足基础无障碍标准
  - 不同文化背景都能找到归属
Conflicts_With:
  - BUSINESS.REVENUE
Related_Goals:
  - COMMUNITY.BONDING
  - CHILD.DEVELOPMENT
Domain_Affinity:
  - PUBLIC_PARK
  - URBAN_PLAZA
  - EDUCATION
Priority: ★ x 4
