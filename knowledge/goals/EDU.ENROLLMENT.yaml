Goal_ID: EDU.ENROLLMENT
Name: 招生
Name_EN: Enrollment
Description: |
  通过空间内容增强机构对家长与孩子的吸引力，直接支持招生转化。
Success_Indicators:
  - 咨询量增长
  - 体验课转化率
  - 续费率
  - 转介绍率
